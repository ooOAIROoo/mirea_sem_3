# Дополнительная конфигурация Apache: свой сайт и реверс-прокси на приложение.
# Файл подключается строкой "Include conf/extra/site.conf" в конце httpd.conf.

# Модули прокси в официальном образе могут быть уже загружены —
# грузим их только если они ещё не активны (иначе Apache ругается на дубль).
<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>

<VirtualHost *:80>
    ServerName pr3.local
    ServerAlias localhost 127.0.0.1

    DocumentRoot "/usr/local/apache2/htdocs"

    <Directory "/usr/local/apache2/htdocs">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    # Всё, что начинается с /api/, уходит в контейнер приложения app:5000.
    # Благодаря этому страница сайта обращается к API по относительному пути
    # (/api/notes) и не требует CORS.
    ProxyPreserveHost On
    ProxyPass        "/api/" "http://app:5000/"
    ProxyPassReverse "/api/" "http://app:5000/"

    # Логи пишем в stdout/stderr контейнера, чтобы их было видно в docker compose logs.
    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    LogLevel  warn
</VirtualHost>
